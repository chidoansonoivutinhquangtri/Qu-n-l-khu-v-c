.logo{width:96px;height:auto;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
h1{margin:0;font-weight:900;font-size:clamp(24px,5.2vw,46px);letter-spacing:.02em;color:var(--gold);line-height:1.05;text-shadow:0 2px 8px rgba(0,0,0,.6);text-transform:uppercase}
.mgr{margin:6px 0 0;font-size:12px;color:#e8efe9;opacity:.92}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.sb{display:flex;gap:8px;margin-bottom:12px}
body.guest .sb{display:none}
.tile.static{cursor:default}
.sb input{flex:1;padding:12px 14px;border-radius:8px;border:2px solid var(--gold);font:inherit;background:var(--card);color:var(--ink)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
nav button,.btn{font:inherit;font-weight:700;padding:9px 14px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
nav button.on,.btn.pri{background:var(--gold);color:#1b1b00;border-color:var(--gold)}
.btn.dng{color:var(--rf);border-color:var(--rf)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,tr:focus-visible{outline:3px solid #4aa3ff;outline-offset:1px}
.panel{background:var(--card);border-radius:10px;padding:16px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
h2{margin:0 0 12px;font-size:17px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{border:0;text-align:left;padding:12px 14px;border-radius:8px;cursor:pointer;font:inherit;border-left:6px solid}
.tile b{display:block;font-size:28px;line-height:1.1}
.tile.red,.b.red,tr.red td:first-child{background:var(--rb);color:var(--rf);border-color:var(--rf)}
.tile.yellow,.b.yellow,tr.yellow td:first-child{background:var(--yb);color:var(--yf);border-color:#e0a800}
.tile.green,.b.green,tr.green td:first-child{background:var(--gb);color:var(--gf);border-color:#2e9e57}
.tile.grey,.b.grey,tr.grey td:first-child{background:var(--kb);color:var(--kf);border-color:#999}
.tile.all{background:var(--soft);color:var(--ink);border-color:var(--g1)}
.b{display:inline-block;padding:3px 9px;border-radius:99px;font-weight:700;font-size:12px;border:0;white-space:nowrap}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:12px;color:var(--mute);padding:6px 8px;border-bottom:2px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td:first-child{border-left:6px solid}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--soft)}
.av{width:44px;height:52px;border-radius:6px;object-fit:cover;background:var(--soft);flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--mute)}
.who{display:flex;gap:10px;align-items:center}.who small,.sub{color:var(--mute);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:inherit;font-size:12px}
.chip.on{background:var(--g1);color:#fff;border-color:var(--g1)}
select,input,textarea{font:inherit;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.chips select{width:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.fc{border:1px solid var(--line);border-left:6px solid;border-radius:8px;padding:12px;display:flex;gap:12px;cursor:pointer;background:var(--card)}
.fc.red{border-left-color:var(--rf)}.fc.yellow{border-left-color:#e0a800}.fc.green{border-left-color:#2e9e57}.fc.grey{border-left-color:#999}
.fc:hover{background:var(--soft)}
.md{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:5}
.md.on{display:flex}
.mb{background:var(--card);border-radius:10px;padding:18px;width:100%;max-width:640px;margin:auto}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg label{font-size:12px;color:var(--mute);display:block}.fg .w{grid-column:1/-1}

#lock.on{display:flex}#lock .mb{max-width:340px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:10;max-width:90vw}
textarea{min-height:110px;font:12px monospace}
.empty{padding:28px;text-align:center;color:var(--mute)}
.sec{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.usr{margin-left:auto;text-align:right;color:#e8efe9;font-size:12px;display:none}.usr.on{display:block}.usr b{color:var(--gold);font-size:13px}.usr .btn{margin-top:6px;padding:5px 10px;font-size:12px}
#login{position:fixed;inset:0;z-index:11;display:none;align-items:center;justify-content:center;padding:16px;background:linear-gradient(rgba(6,38,27,.97),rgba(6,38,27,.99))}
#login.on{display:flex}#login .mb{max-width:380px;text-align:center}#login h1{font-size:28px;margin:6px 0 2px}#login .fg{grid-template-columns:1fr;text-align:left;margin-top:14px}
#login .msg{min-height:20px;color:var(--rf);font-size:13px;margin-top:8px}#login .note{background:var(--yb);color:var(--yf);border-radius:8px;padding:10px;font-size:12px;text-align:left;margin-top:12px}
.chip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;font-style:normal}.chip i.red{background:var(--rf)}.chip i.yellow{background:#e0a800}.chip i.green{background:#2e9e57}.chip i.grey{background:#999}
.fd{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:12px;margin-bottom:16px;align-items:start}@media(max-width:760px){.fd{grid-template-columns:1fr}}
.fi{border:1px solid var(--line);border-left:6px solid;border-radius:8px;padding:12px;background:var(--card)}.fi.red{border-left-color:var(--rf)}.fi.yellow{border-left-color:#e0a800}.fi.green{border-left-color:#2e9e57}.fi.grey{border-left-color:#999}
.fi dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:10px 0 0;font-size:13px}.fi dt{color:var(--mute)}.fi dd{margin:0}
.fd .tiles{margin:0}.st{font-size:12px;color:var(--mute)}.st b{font-weight:700}.st .r{color:var(--rf)}.st .y{color:var(--yf)}.st .g{color:var(--gf)}
body.ro [data-new],body.ro [data-sv],body.ro [data-del],body.ro [data-im],body.ro [data-wipe],body.ro [data-edo]{display:none}
.warn{background:var(--rb);color:var(--rf);border-radius:8px;padding:8px 10px;font-size:12px;margin:0 0 8px;font-weight:700}
.sync{font-size:12px;padding:6px 10px;margin:0 0 8px;border-radius:8px;background:var(--gb);color:var(--gf)}.sync.ro{background:var(--yb);color:var(--yf)}.pd{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;background:#e7f0ff;color:#1d4ed8;margin-left:4px;vertical-align:middle}.sync.q{background:#e7f0ff;color:#1d4ed8}.sync.err{background:var(--rb);color:var(--rf)}
</style>

<script>
const K='xtvh_data_v1',KP='xtvh_pin';
const $=q=>document.querySelector(q);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
const fmt=d=>{if(!d)return'';const[a,b,c]=d.split('-');return c+'/'+b+'/'+a};
const iso=s=>{s=String(s||'').trim();let m;if(m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/))return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return/^\d{4}-\d\d-\d\d$/.test(s)?s:''};
const day=d=>{const[a,b,c]=d.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
// Dữ liệu MẪU chỉ dùng cho chế độ "xem thử" khi chưa kết nối Google Sheet (chưa đặt GOOGLE_SCRIPT_URL).
function seed(){let n=4;const own=[['08 Phan Đình Phùng','Lê Thị Huế','1954-02-10','045154003558'],['55 Chế Lan Viên','Trần Văn Hoa','1959-05-20','045059002998'],
['06 Lê Thế Hiếu','Trịnh Thị Thu Trang','1982-04-06','045182008183'],['17 Lê Thế Hiếu','Đỗ Thị Phương Dung','1991-07-03','045191008608']].map(a=>({row:++n,fac:a[0],name:a[1],dob:a[2],cccd:a[3],type:'Nhà trọ'}));
 const t=k=>{const d=today();d.setDate(d.getDate()+k);return d.toLocaleDateString('sv')};n=4;
 const res=[['55 Chế Lan Viên','Nguyễn Văn A','1995-01-01','045095000001','Phong Điền, Huế','Công nhân','Lương',t(-250),'Đã đăng ký',t(-240),t(480)],
 ['55 Chế Lan Viên','Trần Thị B','1999-06-15','045199000002','Hải Lăng, Quảng Trị','Sinh viên','Gia đình hỗ trợ',t(-340),'Đã đăng ký',t(-335),t(15)],
 ['08 Phan Đình Phùng','Lê Văn C','2000-09-09','045200000003','Cam Lộ, Quảng Trị','Lao động tự do','Thu nhập tự do',t(-20),'Chưa đăng ký','','']].map(a=>({row:++n,fac:a[0],name:a[1],dob:a[2],cccd:a[3],addr:a[4],job:a[5],income:a[6],moveIn:a[7],status:a[8],regDate:a[9],expiry:a[10],fine:'Không',note:'DỮ LIỆU MẪU'}));
 return{cfg:{days:20},own,res,at:new Date().toISOString()}}
let S={cfg:{days:20},own:[],res:[]};
// Dữ liệu cá nhân không còn lưu trên máy; xóa bản lưu cũ (nếu có) để bảo mật.
try{localStorage.removeItem(K)}catch(e){}
// ---- đồng bộ Google Sheet + đăng nhập ----
const API='/api/sheet',KT='xtvh_token';let RO=false,PUBRO=false,QUEUE=false,PENDING=0,DEMO=false,USER=null,TOKEN='',SYNC={at:'',err:'',busy:false};
try{TOKEN=localStorage.getItem(KT)||''}catch(e){}
function save(){}
function load(d){
 const own=(d.own||[]).map(o=>({id:'o'+o.row,row:o.row,pending:o.pending||'',fac:o.fac||'',name:o.name||'',dob:o.dob||'',cccd:o.cccd||'',type:o.type||'Nhà trọ',phone:o.phone||'',rooms:o.rooms||'',note:o.note||'',photo:o.photo||''}));
 const byName={};own.forEach(o=>{if(!byName[o.fac])byName[o.fac]=o.id});
 const res=(d.res||[]).map(r=>({id:'r'+r.row,row:r.row,pending:r.pending||'',fac:byName[r.fac]||'',facName:r.fac||'',name:r.name||'',dob:r.dob||'',cccd:r.cccd||'',addr:r.addr||'',job:r.job||'',income:r.income||'',moveIn:r.moveIn||'',
  status:['Chưa đăng ký','Đã đăng ký','Không thuộc diện'].includes(r.status)?r.status:'Chưa đăng ký',regDate:r.regDate||'',expiry:r.expiry||'',fine:r.fine==='Có'?'Có':'Không',note:r.note||'',photo:r.photo||''}));
 S={cfg:{days:(d.cfg&&d.cfg.days)||20},own,res};PENDING=d.pending||0;SYNC.at=d.at||new Date().toISOString();SYNC.err=''}
const sig=()=>JSON.stringify([S.cfg,S.own,S.res]);
async function api(action,extra){
 const r=await fetch(API,{method:'POST',cache:'no-store',headers:{'content-type':'application/json'},body:JSON.stringify({action,token:TOKEN,...extra})});
 let d={};try{d=await r.json()}catch(e){d={ok:false,error:'Máy chủ không phản hồi'}}
 d.status=r.status;return d}
// Quyền: Quản trị, Phó Quản trị = toàn quyền · Nhập liệu · Chỉ xem · Khách = chỉ xem số liệu tổng quan và nhập hồ sơ mới.
const isAdm=()=>!!USER&&!DEMO&&(USER.role==='Quản trị'||USER.role==='Phó Quản trị');
// Mọi tài khoản không phải Quản trị / Phó Quản trị chỉ thấy số liệu tổng quan (máy chủ cũng không gửi thông tin cá nhân).
const isGuest=()=>!!USER&&!DEMO&&!isAdm();
function setUser(u,published){USER=u;RO=DEMO||PUBRO||!u||u.role==='Chỉ xem';document.body.classList.toggle('ro',RO);document.body.classList.toggle('guest',isGuest());
 if(isGuest()){view='home';$('#q').value=''}
 const w=$('#who');w.classList.toggle('on',!!u);
 w.innerHTML=u?`<b>${esc(u.name||u.phone)}</b><br>${esc(u.phone)} · ${esc(u.role)}<br><button class="btn" data-logout>${DEMO?'Thoát xem thử':'Đăng xuất'}</button>`:'';
 if(published!==undefined)$('#pubw').innerHTML=published?'<div class="warn">CẢNH BÁO BẢO MẬT: Google Sheet vẫn đang "Xuất bản lên web" – ai có đường link đều xem được CCCD và mật khẩu. Vào Google Sheet → Tệp → Chia sẻ → Xuất bản lên web → Dừng xuất bản.</div>':''}
function loginUI(msg,setup){
 S={cfg:{days:20},own:[],res:[]};USER=null;setUser(null,false);close();
 const logo=$('.logo').src;
 $('#lg').innerHTML=`<img src="${logo}" alt="" style="width:84px"><h1 style="color:var(--g1)">Xóm trọ văn hóa</h1><p class="sub">Đăng nhập bằng số điện thoại và mật khẩu được cấp</p>
 <form id="lf" class="fg" autocomplete="on"><div><label for="l_ph">Số điện thoại</label><input id="l_ph" type="tel" inputmode="tel" autocomplete="username" required></div>
 <div><label for="l_pw">Mật khẩu</label><input id="l_pw" type="password" autocomplete="current-password" required></div>
 <button class="btn pri" type="submit" id="l_go" ${setup===false?'disabled':''}>Đăng nhập</button></form><div class="msg" id="l_msg">${esc(msg||'')}</div>
 ${setup===false?`<div class="note"><b>Chưa đọc được Google Sheet.</b> Hãy tải bản Excel mẫu lên Google Sheet và chọn Tệp → Chia sẻ → Xuất bản lên web → Toàn bộ tài liệu (hoặc đặt <code>GOOGLE_SERVICE_ACCOUNT_JSON</code> để ghi thẳng lên sheet). Trong lúc chờ, có thể xem thử giao diện với dữ liệu mẫu (không phải dữ liệu thật, không lưu được).<div class="row" style="justify-content:flex-start;margin-top:8px"><a class="btn" href="/google-sheet/xom-tro-van-hoa.xlsx" download>Tải bản Excel mẫu</a><button class="btn" data-demo>Xem thử với dữ liệu mẫu</button></div></div>`:''}`;
 $('#login').classList.add('on');setTimeout(()=>{const i=$('#l_ph');if(i)i.focus()},50)}
async function doLogin(){
 const phone=$('#l_ph').value.trim(),password=$('#l_pw').value,m=$('#l_msg'),b=$('#l_go');
 if(!phone||!password){m.textContent='Nhập số điện thoại và mật khẩu';return}
 b.disabled=true;m.textContent='Đang kiểm tra…';
 try{const d=await api('login',{phone,password});
  if(!d.ok){b.disabled=d.setup===false;m.textContent=d.error||'Đăng nhập thất bại';return}
  TOKEN=d.token;try{localStorage.setItem(KT,TOKEN)}catch(e){}
  DEMO=false;PUBRO=!!d.readOnly;QUEUE=!!d.queue;setUser(d.user,d.published);load(d.data);$('#login').classList.remove('on');view='home';render();toast('Xin chào '+(d.user.name||d.user.phone))}
 catch(e){b.disabled=false;m.textContent='Không kết nối được máy chủ'}}
async function logout(msg){
 if(TOKEN&&!DEMO)api('logout').catch(()=>{});
 TOKEN='';DEMO=false;try{localStorage.removeItem(KT)}catch(e){}
 loginUI(msg||'',true);render()}
function demo(){DEMO=true;load(seed());setUser({name:'Xem thử (dữ liệu mẫu)',phone:'—',role:'Chỉ xem'},false);SYNC.err='';$('#login').classList.remove('on');view='home';render()}
async function pull(force){
 if(DEMO||!USER&&!force||SYNC.busy||(!force&&($('#md').classList.contains('on')||document.hidden)))return;
 try{const d=await api('read');
  if(d.setup===false){DEMO||loginUI(d.error||'',false);return}
  if(d.status===401||d.status===403){return USER||TOKEN?logout(d.error):loginUI('',true)}
  if(!d.ok)throw new Error(d.error);
  if(SYNC.busy)return;const before=sig(),first=!USER;PUBRO=!!d.readOnly;QUEUE=!!d.queue;setUser(d.user,d.published);load(d.data);$('#login').classList.remove('on');
  if(first||force||sig()!==before)render();else syncBar()}
 catch(e){SYNC.err='Không kết nối được Google Sheet – đang hiển thị dữ liệu lần tải gần nhất.';syncBar()}}
async function push(ops,msg){

function resize(file,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const m=240,k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};i.src=r.result};r.readAsDataURL(file)}

function imp(k){const t=$('#tx').value;if(!t.trim())return toast('Hãy dán nội dung vào ô trước');
 let ops=[];
 try{if(k==='json'){const d=JSON.parse(t);if(!d.res||!d.own)throw 0;if(!confirm('Thay TOÀN BỘ dữ liệu trên Google Sheet bằng bản sao lưu?'))return;
  const nm={};d.own.forEach(o=>nm[o.id]=o.fac);ops.push({op:'wipe'});
  d.own.forEach(o=>ops.push({kind:'own',op:'add',rec:{...ownRec(o),photo:o.photo||''}}));
  d.res.forEach(r=>ops.push({kind:'res',op:'add',rec:{...resRec(r),fac:nm[r.fac]||r.facName||'',photo:r.photo||''}}));
  if(d.cfg&&d.cfg.days)ops.push({op:'cfg',days:d.cfg.days})}
 else{const L=t.split(/\r?\n/).filter(x=>x.trim()).map(x=>x.split('\t').map(y=>y.trim()));const have=new Set(S.own.map(o=>o.fac));
  if(k==='own')L.forEach(c=>{if(!c[0]||/^tên cơ sở/i.test(c[0])||have.has(c[0]))return;have.add(c[0]);ops.push({kind:'own',op:'add',rec:{fac:c[0],name:c[1]||'',dob:iso(c[2]),cccd:c[3]||'',type:c[4]||'Nhà trọ',phone:c[5]||'',rooms:c[6]||'',note:c[7]||''}})});
  else L.forEach(c=>{if(!c[1]||/^họ tên/i.test(c[1]))return;const f=c[0]||'(chưa rõ)';if(!have.has(f)){have.add(f);ops.unshift({kind:'own',op:'add',rec:{fac:f,name:'',type:'Nhà trọ'}})}
   ops.push({kind:'res',op:'add',rec:{fac:f,name:c[1],dob:iso(c[2]),cccd:c[3]||'',addr:c[4]||'',job:c[5]||'',income:c[6]||'',moveIn:iso(c[7]),status:['Chưa đăng ký','Đã đăng ký','Không thuộc diện'].includes(c[8])?c[8]:'Chưa đăng ký',regDate:iso(c[9]),expiry:iso(c[10]),fine:c[11]==='Có'?'Có':'Không',note:c[12]||''}})})}}
 catch(e){return toast('Nội dung không đúng định dạng')}
 if(!ops.length)return toast('Không có dòng mới để nhập');
 push(ops,'Đã nhập dữ liệu lên Google Sheet')}

async function hash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('xtvh'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'p'+btoa(p)}}

 else if(d.go){view='res';flt=d.go==='red'||d.go==='yellow'||d.go==='green'||d.go==='grey'?d.go:'all';ff='';render()}
 else if(d.f){flt=d.f;render()}
 else if(d.df){dflt=d.df;render()}
 else if(d.edo)fo(own(d.edo));
 else if(d.r)fr(S.res.find(r=>r.id===d.r));
 else if(d.o){const o=own(d.o);if(!o)return;cur=o.fac;dflt='all';view='facd';$('#q').value='';render();scrollTo(0,0)}
 else if(d.new)d.new==='r'?fr(null,d.fac):fo();

 else if(d.del){if(!confirm('Xóa hồ sơ này?'))return;const id=d.id||[...$('#mb').querySelectorAll('[data-sv]')][0].dataset.id;
  const x=d.del==='r'?S.res.find(r=>r.id===id):own(id);if(!x)return close();
  if(d.del==='o'&&S.res.some(r=>r.fac===id)&&!confirm('Xóa cơ sở sẽ xóa luôn những người cư trú thuộc cơ sở này trên Google Sheet. Tiếp tục?'))return;
  push([{kind:d.del==='r'?'res':'own',op:'delete',row:x.row,expect:x.name}],'Đã xóa').then(ok=>{if(ok){close();if(d.del==='o'){view='fac';render()}}})}
 else if(d.ex){$('#tx').value=d.ex==='json'?JSON.stringify(S):d.ex==='res'?S.res.map(rc).join('\n'):S.own.map(oc).join('\n');$('#tx').select()}
 else if('cp'in d){$('#tx').select();try{document.execCommand('copy');toast('Đã sao chép')}catch(x){toast('Hãy bấm Ctrl+C để sao chép')}}
 else if(d.im)imp(d.im);
 else if(d.pin){if(d.pin==='set')lockUI('set');else if(d.pin==='off'){localStorage.removeItem(KP);render();toast('Đã tắt PIN')}else lockUI('in')}
 else if('pinx'in d)$('#lock').classList.remove('on');
 else if(d.pinok)pinOk(d.pinok);
 else if('wipe'in d){if(confirm('Xóa toàn bộ dữ liệu trên Google Sheet? Không thể hoàn tác.'))push([{op:'wipe'}],'Đã xóa toàn bộ dữ liệu')}
 else if('refresh'in d)pull(true).then(()=>toast('Đã làm mới'));});
document.addEventListener('submit',e=>{if(e.target.id==='lf'){e.preventDefault();doLogin()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='pin')pinOk($('#lk').querySelector('[data-pinok]').dataset.pinok);else if(e.target.matches('tr[data-r],.fc'))e.target.click()}if(e.key==='Escape'&&!$('#login').classList.contains('on'))close()});
document.addEventListener('change',e=>{
 if(e.target.id==='ffs'){ff=e.target.value;render()}
 if(e.target.id==='days'){S.cfg.days=Math.max(1,+e.target.value||20);render();push([{op:'cfg',days:S.cfg.days}],'Đã lưu')}
 if(e.target.id==='ph'&&e.target.files[0])resize(e.target.files[0],u=>{ph=u;$('#pvw').innerHTML=av(u,'?')})});
$('#q').addEventListener('input',render);
$('#md').addEventListener('mousedown',e=>{if(e.target.id==='md')close()});
render();syncBar('Đang tải dữ liệu từ Google Sheet…');if(TOKEN)pull(true);else api('read').then(d=>loginUI(d.setup===false?d.error||'':'',d.setup!==false)).catch(()=>loginUI('',true));setInterval(()=>pull(false),20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull(false)});
try{if(localStorage.getItem(KP))lockUI('in')}catch(e){}
</script>
</body>
